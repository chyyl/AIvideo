[project]
name = "aivscript"
version = "0.1.0"
description = "AI 视频脚本自动生成器：Textual TUI + YAML 分镜 DSL + 提示词库"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.60",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aivscript = "aivscript.__main__:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aivscript"]

[tool.pytest.ini_options]
testpaths = ["tests"]
