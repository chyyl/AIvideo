dsl: aivscript/1.0
meta:
  title: 末班地铁里
  logline: 悬疑短片：末班地铁里，她捡到一张写给自己的车票。阿岚为了一个说不清的答案，必须在黎明前放弃他唯一确定的东西。
  genre: 悬疑
  style: 冷峻霓虹、雨夜、低饱和
  language: zh-CN
  aspect_ratio: '16:9'
  target_duration: 90
  audience: 通用受众
  tone: 不安、克制
characters:
- id: char-1
  name: 阿岚
  role: 主角
  age: 30 岁上下
  appearance: 短发，深灰风衣，右手腕有一道旧疤
  voice: 几乎不用感叹句，语速慢，停顿多
  arc: 从回避到承认：他最终选择了说真话，但已经太晚
- id: char-2
  name: 老周
  role: 同伴 / 阻碍
  age: 45 岁
  appearance: 微胖，旧夹克，总是拎着一个磨破的公文包
  voice: 热络、爱讲道理、句子长
  arc: 他一直在替主角维持体面，最后先离开
acts:
- id: act-1
  title: 第一幕 · 日常的裂缝
